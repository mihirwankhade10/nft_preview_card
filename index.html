<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NFT preview card component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <div class="card__images">
      <img src="images/image-equilibrium.jpg" alt="Equilibrium NFT artwork" />
      <div class="card__images-layer">
        <img src="images/icon-view.svg" alt="View" />
      </div>
    </div>

    <div class="card__title">
      <h1><a href="#">Equilibrium #3429</a></h1>
    </div>
    <p class="card__info">Our Equilibrium collection promotes balance and calm.</p>

    <div class="card__time">
      <div class="card__time-left">
        <img src="images/icon-ethereum.svg" alt="Ethereum" />
        <span>0.041 ETH</span>
      </div>
      <div class="card__time-right">
        <img src="images/icon-clock.svg" alt="Clock" />
        <span>3 days left</span>
      </div>
    </div>

    <hr />

    <div class="card__creator">
      <img src="images/image-avatar.png" alt="Jules Wyvern" />
      <p>Creation of <a href="#">Jules Wyvern</a></p>
    </div>
  </main>

  <footer class="attribution">
    Challenge by
    <a href="https://www.crio.do" target="_blank" rel="noopener">Crio.Do</a>.
    Coded by
    <a href="https://www.github.com/mihirwankhade10" target="_blank" rel="noopener">Mihir Wankhade</a>.
  </footer>
</body>
</html>
